name: Sephora SQL Lab Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database driver
        run: python -m pip install psycopg2-binary

      - name: Check Python syntax
        run: python -m compileall -q app.py database.py questions.py

      - name: Check quiz structure
        run: |
          python - <<'PY'
          from questions import QUESTIONS

          assert len(QUESTIONS) == 5
          assert sum(q["points"] for q in QUESTIONS) == 20
          assert len({q["id"] for q in QUESTIONS}) == 5

          for q in QUESTIONS:
              assert q["prompt"].strip()
              assert q["solution"].strip()
              assert q["expected"].strip()

          print("All quiz structure checks passed!")
          PY

      - name: Test Supabase database connection
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          QUIZ_DB_USER: ${{ secrets.QUIZ_DB_USER }}
          QUIZ_DB_PASSWORD: ${{ secrets.QUIZ_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(
              dbname=os.environ["POSTGRES_DB"],
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              user=os.environ["QUIZ_DB_USER"],
              password=os.environ["QUIZ_DB_PASSWORD"],
              sslmode=os.environ["DB_SSLMODE"],
              connect_timeout=10,
          )

          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM products")
                  product_count = cur.fetchone()[0]

                  cur.execute("SELECT COUNT(*) FROM reviews")
                  review_count = cur.fetchone()[0]

              assert product_count == 8494
              assert review_count == 10000

              print("Database connection successful!")
              print(f"Products: {product_count}")
              print(f"Reviews: {review_count}")
          finally:
              conn.close()
          PY
